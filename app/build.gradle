plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashenlantern.holdtheroad'
    compileSdk 36

    defaultConfig {
        applicationId "com.ashenlantern.holdtheroad"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ks = file('upload.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file('upload.jks').exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    // align old kotlin-stdlib-jdk7/jdk8 pulled in transitively with the main stdlib
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
