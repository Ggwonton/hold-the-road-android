plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashenlantern.holdtheroad'
    compileSdk 36

    defaultConfig {
        applicationId "com.ashenlantern.holdtheroad"
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName "1.1"

    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ks = file('upload.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    // AdMob: release builds use the real ids from gradle.properties; debug builds always use
    // Google's official test ids so nobody can click real ads during development.
    def testApp = 'ca-app-pub-3940256099942544~3347511713'
    def testInter = 'ca-app-pub-3940256099942544/1033173712'
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: testApp]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${testInter}\""
        }
        release {
            manifestPlaceholders = [admobAppId: (project.findProperty('ADMOB_APP_ID') ?: testApp)]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${project.findProperty('ADMOB_INTERSTITIAL_ID') ?: testInter}\""
            minifyEnabled false
            if (file('upload.jks').exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    // align old kotlin-stdlib-jdk7/jdk8 pulled in transitively with the main stdlib
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
